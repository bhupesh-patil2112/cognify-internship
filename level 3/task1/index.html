<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery and Slideshow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <!-- Gallery -->
    <div class="gallery">

        <a href="#img1">
            <img src="https://picsum.photos/id/1015/200/150" alt="">
        </a>

        <a href="#img2">
            <img src="https://picsum.photos/id/1016/200/150" alt="">
        </a>

        <a href="#img3">
            <img src="https://picsum.photos/id/1018/200/150" alt="">
        </a>

        <a href="#img4">
            <img src="https://picsum.photos/id/1020/200/150" alt="">
        </a>

    </div>

    <!-- Enlarged Images -->
    <div id="img1" class="lightbox">
        <a href="#">
            <img src="https://picsum.photos/id/1015/800/500" alt="">
        </a>
    </div>

    <div id="img2" class="lightbox">
        <a href="#">
            <img src="https://picsum.photos/id/1016/800/500" alt="">
        </a>
    </div>

    <div id="img3" class="lightbox">
        <a href="#">
            <img src="https://picsum.photos/id/1018/800/500" alt="">
        </a>
    </div>

    <div id="img4" class="lightbox">
        <a href="#">
            <img src="https://picsum.photos/id/1020/800/500" alt="">
        </a>
    </div>

    <h1>Automatic Slideshow</h1>

    <div class="slider">
        <div class="slides">
            <img src="https://picsum.photos/id/1015/800/400" alt="">
            <img src="https://picsum.photos/id/1016/800/400" alt="">
            <img src="https://picsum.photos/id/1018/800/400" alt="">
            <img src="https://picsum.photos/id/1020/800/400" alt="">
        </div>
    </div>

</body>
</html>
